name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.16"
      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: uv sync --locked --dev
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: python3 scripts/verify_dashboard_assets.py dashboard/dist
        working-directory: ${{ github.workspace }}

  frontend-sentry-release:
    if: github.event_name == 'push' && github.event.repository.fork == false
    needs: frontend
    runs-on: ubuntu-latest
    env:
      MAAIS_DASHBOARD_OUT_DIR: dist-sourcemaps
      MAAIS_SOURCE_MAP_UPLOAD: "true"
      SENTRY_PROJECT: maais-mission-control
      SENTRY_RELEASE: ${{ github.sha }}
      VITE_SENTRY_ENVIRONMENT: qualification
      VITE_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - id: sentry_secrets
        name: Check sealed Sentry release inputs
        env:
          AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          BROWSER_DSN: ${{ secrets.SENTRY_BROWSER_DSN }}
          ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          if [[ -n "${AUTH_TOKEN}" && -n "${BROWSER_DSN}" && -n "${ORG}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          fi
      - run: npm ci
        working-directory: dashboard
      - name: Upload exact-release Mission Control source maps
        if: steps.sentry_secrets.outputs.configured == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_BROWSER_DSN }}
        run: npm run build
        working-directory: dashboard
      - name: Verify finalized Sentry release
        if: steps.sentry_secrets.outputs.configured == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: ./node_modules/.bin/sentry-cli releases info "${SENTRY_RELEASE}"
        working-directory: dashboard
      - name: Verify map-free deployable inventory
        if: steps.sentry_secrets.outputs.configured == 'true'
        run: python3 scripts/verify_dashboard_assets.py dashboard/dist-sourcemaps
      - uses: actions/upload-artifact@v7
        if: steps.sentry_secrets.outputs.configured == 'true'
        with:
          name: mission-control-assets-${{ github.sha }}
          path: dashboard/dist-sourcemaps
          if-no-files-found: error
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: uv sync --locked --dev
      - run: uv run pip-audit
      - run: >-
          git ls-files -z |
          xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
          --exclude-files '(^uv\.lock$|^\.superpowers/)'
      - run: uv run pytest tests/test_execution_safety.py -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maais_test
          POSTGRES_USER: maais
          POSTGRES_PASSWORD: maais
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maais -d maais_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://maais:maais@localhost:5432/maais_test
      MAAIS_TEST_DATABASE_URL: postgresql+psycopg://maais:maais@localhost:5432/maais_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.16"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv sync --locked --dev
      - run: uv run alembic upgrade 0022
      - run: uv run alembic downgrade 0018
      - run: uv run alembic upgrade 0022
      - run: uv run alembic check
      - run: >-
          uv run pytest -q
          tests/integration/test_platform_schema.py
          tests/integration/test_database_roles.py
      - run: >-
          uv run pytest -q
          --cov=maais.execution.paper
          --cov=maais.db.repositories
          --cov=maais.risk
          --cov=maais.orchestration
          --cov=maais.market_data.recovery
          --ignore=tests/e2e
          --cov-branch
          --cov-report=term:skip-covered
          --cov-fail-under=80
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: python3 scripts/verify_dashboard_assets.py dashboard/dist
      - run: npm exec -- playwright install-deps chromium
        working-directory: dashboard
      - run: npm exec -- playwright-cli install-browser chrome-for-testing
        working-directory: dashboard
      - run: uv run pytest -q tests/e2e/test_mission_control_auth.py
      - run: >-
          PGPASSWORD=maais psql -h localhost -U maais -d maais_test -Atc
          'select version_num from alembic_version' | grep -Fx 0022

  artifact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: uv sync --locked --dev
      - run: >-
          uv run pytest -q
          tests/contracts
          tests/unit/artifacts
          tests/unit/config/test_artifact_settings.py
          tests/unit/operations/test_cloud_artifact_cron.py

  redaction-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: uv sync --locked --dev
      - run: >-
          uv run pytest -q
          tests/unit/observability/test_redaction.py
          tests/unit/observability/test_structured_logging.py
          tests/unit/observability/test_sentry.py
          tests/unit/config/test_observability_settings.py

  container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: uv sync --locked --dev
      - name: Create credential-free OCI candidate
        run: |
          docker buildx create --name maais-ci --driver docker-container --use
          docker buildx inspect --bootstrap
          image_archive="${RUNNER_TEMP}/maais-candidate.oci.tar"
          docker buildx build \
            --build-arg RAILWAY_GIT_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg MAAIS_SOURCE_CLEAN=true \
            --build-arg VITE_SENTRY_DSN=https://browser-public-key@o0.ingest.sentry.io/456 \
            --build-arg VITE_SENTRY_ENVIRONMENT=qualification \
            --output "type=oci,dest=${image_archive}" \
            .
          echo "MAAIS_TEST_IMAGE=${image_archive}" >> "${GITHUB_ENV}"
      - run: uv run pytest -q tests/container
      - name: Remove ephemeral OCI builder
        if: always()
        run: docker buildx rm maais-ci

  release-candidate:
    needs:
      - quality
      - test
      - frontend
      - security
      - postgres-integration
      - artifact-contract
      - redaction-contract
      - container-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv sync --locked --dev
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
        env:
          VITE_SENTRY_DSN: https://browser-public-key@o0.ingest.sentry.io/456
          VITE_SENTRY_ENVIRONMENT: qualification
          VITE_SENTRY_RELEASE: ${{ github.sha }}
      - run: ./scripts/verify-release-candidate.sh "${GITHUB_SHA}"
